<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BadBank Application</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary px-4 mb-4">
    <span class="navbar-brand mb-0 h1">🏦 BadBank Portal</span>
  </nav>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm p-4 text-center mb-4">
          <h5>Account Balance</h5>
          <h2 class="text-success my-2" id="balanceDisplay">$100</h2>
        </div>

        <div class="card shadow-sm p-4">
          <ul class="nav nav-pills nav-fill mb-3" id="pills-tab">
            <li class="nav-item">
              <button class="nav-link active" id="depositTab" onclick="switchAction('deposit')">Deposit</button>
            </li>
            <li class="nav-item">
              <button class="nav-link" id="withdrawTab" onclick="switchAction('withdraw')">Withdraw</button>
            </li>
          </ul>

          <div class="mb-3">
            <label class="form-label" id="actionLabel">Deposit Amount</label>
            <input type="number" class="form-control" id="amountInput" placeholder="Enter amount" />
          </div>

          <button class="btn btn-primary w-100" id="actionBtn" onclick="handleTransaction()">Submit</button>
          <div id="alertBox" class="mt-3"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let balance = 100;
    let mode = 'deposit';

    function switchAction(type) {
      mode = type;
      document.getElementById('amountInput').value = '';
      document.getElementById('alertBox').innerHTML = '';
      if (type === 'deposit') {
        document.getElementById('depositTab').classList.add('active');
        document.getElementById('withdrawTab').classList.remove('active');
        document.getElementById('actionLabel').innerText = 'Deposit Amount';
      } else {
        document.getElementById('withdrawTab').classList.add('active');
        document.getElementById('depositTab').classList.remove('active');
        document.getElementById('actionLabel').innerText = 'Withdraw Amount';
      }
    }

    function handleTransaction() {
      const val = parseFloat(document.getElementById('amountInput').value);
      const alertBox = document.getElementById('alertBox');

      if (isNaN(val) || val <= 0) {
        alertBox.innerHTML = '<div class="alert alert-danger py-2">Please enter a valid positive amount.</div>';
        return;
      }

      if (mode === 'deposit') {
        balance += val;
        alertBox.innerHTML = `<div class="alert alert-success py-2">Successfully deposited $${val}!</div>`;
      } else {
        if (val > balance) {
          alertBox.innerHTML = '<div class="alert alert-warning py-2">Transaction failed: Insufficient balance!</div>';
          return;
        }
        balance -= val;
        alertBox.innerHTML = `<div class="alert alert-success py-2">Successfully withdrew $${val}!</div>`;
      }

      document.getElementById('balanceDisplay').innerText = `$${balance}`;
      document.getElementById('amountInput').value = '';
    }
  </script>
</body>
</html>
